<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Pokerface</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111714;
        --panel: #18221d;
        --panel-2: #202c26;
        --text: #eef7f0;
        --muted: #a9b8ae;
        --line: #324238;
        --accent: #38c172;
        --accent-2: #f4c95d;
        --danger: #ff6b6b;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        background: radial-gradient(
          circle at top left,
          #1d3a2a 0,
          #111714 42%,
          #0c100e 100%
        );
        color: var(--text);
      }

      button,
      input,
      select {
        font: inherit;
      }

      .app {
        width: min(1080px, 100%);
        margin: 0 auto;
        padding: 18px clamp(14px, 3vw, 28px) 28px;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 5vw, 40px);
        font-weight: 800;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      .setup {
        background: rgba(24, 34, 29, 0.92);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        box-shadow: var(--shadow);
        margin-bottom: 14px;
      }

      .setup-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
        align-items: end;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      input,
      select {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0f1512;
        color: var(--text);
        padding: 0 10px;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(56, 193, 114, 0.16);
      }

      .check-row {
        display: flex;
        min-height: 42px;
        align-items: center;
        gap: 8px;
        color: var(--text);
      }

      input[type="checkbox"] {
        width: 18px;
        min-height: 18px;
        accent-color: var(--accent);
      }

      .btn {
        min-height: 42px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: var(--panel-2);
        color: var(--text);
        padding: 0 12px;
        cursor: pointer;
        touch-action: manipulation;
      }

      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      .btn.primary {
        background: var(--accent);
        color: #06110b;
        font-weight: 700;
      }

      .btn.warn {
        background: #463a1f;
        color: #ffe7a6;
      }
      .btn.danger {
        background: #3f2020;
        color: #ffd0d0;
      }

      .table {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 14px;
        align-items: start;
      }

      .console,
      .controls {
        background: rgba(13, 18, 15, 0.92);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .console {
        min-height: 560px;
        max-height: calc(100vh - 235px);
        overflow: auto;
        padding: 14px;
        scroll-behavior: smooth;
      }

      .output {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          14px/1.55 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          "Liberation Mono",
          monospace;
        color: #eaf7ed;
      }

      .controls {
        padding: 14px;
        display: grid;
        gap: 12px;
        position: sticky;
        top: 12px;
      }

      .prompt {
        min-height: 42px;
        padding: 10px;
        background: #101713;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--accent-2);
        font-size: 13px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      .quick-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .amount-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px;
        align-items: center;
      }

      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      body.playing {
        padding-bottom: 124px;
      }

      .setup {
        transition:
          border-color 160ms ease,
          background 160ms ease;
      }

      .setup summary,
      .log-panel summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 32px;
        cursor: pointer;
        color: var(--muted);
        list-style: none;
        user-select: none;
      }

      .setup summary::-webkit-details-marker,
      .log-panel summary::-webkit-details-marker {
        display: none;
      }

      #setupSummary {
        overflow: hidden;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text);
        font-size: 12px;
      }

      body.playing .setup {
        padding: 10px 12px;
        box-shadow: none;
      }

      body.playing .setup:not([open]) {
        background: rgba(16, 23, 19, 0.82);
      }

      .setup[open] .setup-grid {
        margin-top: 12px;
      }

      .game-shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 308px;
        gap: 14px;
        align-items: start;
      }

      .table-top,
      .stats-strip,
      .action-panel,
      .felt,
      .players-panel,
      .review-panel,
      .log-panel {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        background: rgba(13, 18, 15, 0.78);
        box-shadow: var(--shadow);
      }

      .table-top {
        grid-column: 1 / 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px;
      }

      .eyebrow {
        color: var(--accent-2);
        font-size: 12px;
        font-weight: 700;
      }

      h2 {
        margin: 2px 0 0;
        font-size: 24px;
        letter-spacing: 0;
      }

      .icon-btn {
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        padding: 0 12px;
      }

      .stats-strip {
        grid-column: 1 / 2;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        overflow: hidden;
      }

      .stats-strip div {
        display: grid;
        gap: 4px;
        min-width: 0;
        padding: 12px;
        border-right: 1px solid rgba(255, 255, 255, 0.07);
      }

      .stats-strip div:last-child {
        border-right: 0;
      }

      .stats-strip span {
        color: var(--muted);
        font-size: 11px;
      }

      .stats-strip strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 18px;
      }

      .action-panel {
        grid-column: 1 / 2;
        display: grid;
        gap: 10px;
        padding: 12px 14px;
        background:
          linear-gradient(
            135deg,
            rgba(244, 201, 93, 0.14),
            rgba(56, 193, 114, 0.05)
          ),
          rgba(13, 18, 15, 0.82);
      }

      .action-focus {
        min-height: 34px;
        border-left: 3px solid var(--accent-2);
        padding-left: 10px;
        color: var(--text);
        font-size: 18px;
        font-weight: 850;
        line-height: 1.35;
      }

      .felt {
        grid-column: 1 / 2;
        position: relative;
        min-height: 268px;
        padding: 18px;
        background:
          radial-gradient(
            circle at 50% 35%,
            rgba(56, 193, 114, 0.18),
            transparent 42%
          ),
          linear-gradient(
            145deg,
            rgba(15, 75, 45, 0.92),
            rgba(10, 33, 24, 0.94)
          );
      }

      .zone {
        display: grid;
        gap: 10px;
        margin-bottom: 24px;
      }

      .zone:last-child {
        margin-bottom: 0;
      }

      .zone-title,
      .section-title {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .cards {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 72px;
        align-items: center;
      }

      .card {
        display: grid;
        grid-template-rows: auto auto;
        gap: 2px;
        width: 48px;
        height: 66px;
        place-items: center;
        border-radius: 7px;
        background: #f5f1e8;
        color: #141817;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
        font-weight: 800;
      }

      .card.red {
        color: #b4232c;
      }

      .card.empty {
        border: 1px dashed rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.34);
        box-shadow: none;
      }

      .card .rank {
        font-size: 18px;
        line-height: 1;
      }

      .card .suit {
        font-size: 28px;
        line-height: 1;
      }

      .hero-cards .card {
        width: 58px;
        height: 78px;
      }

      .players-panel {
        grid-column: 2 / 3;
        grid-row: 1 / span 3;
        padding: 14px;
      }

      .players-list {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }

      .player-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }

      .player-row:last-child {
        border-bottom: 0;
      }

      .player-main {
        min-width: 0;
      }

      .player-name {
        display: flex;
        gap: 6px;
        align-items: center;
        min-width: 0;
        font-weight: 700;
      }

      .player-name span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .player-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .player-stack {
        text-align: right;
        font-weight: 800;
      }

      .badge {
        border-radius: 999px;
        background: rgba(244, 201, 93, 0.14);
        color: var(--accent-2);
        padding: 2px 7px;
        font-size: 11px;
        font-weight: 700;
      }

      .player-row.active-turn {
        color: var(--accent-2);
      }

      .action-pill,
      .round-pill {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 12px;
        font-weight: 800;
        line-height: 1;
      }

      .round-pill {
        background: rgba(255, 255, 255, 0.08);
        color: var(--muted);
      }

      .action-pill.active,
      .action-pill.bet,
      .action-pill.raise,
      .action-pill.allin {
        background: rgba(244, 201, 93, 0.18);
        color: #ffe08a;
        box-shadow: inset 0 0 0 1px rgba(244, 201, 93, 0.28);
      }

      .action-pill.call,
      .action-pill.check {
        background: rgba(56, 193, 114, 0.16);
        color: #76e6a2;
        box-shadow: inset 0 0 0 1px rgba(56, 193, 114, 0.24);
      }

      .action-pill.fold {
        background: rgba(255, 107, 107, 0.16);
        color: #ff9c9c;
        box-shadow: inset 0 0 0 1px rgba(255, 107, 107, 0.22);
      }

      .action-pill.wait {
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
      }

      .review-panel {
        grid-column: 1 / -1;
        display: grid;
        gap: 12px;
        padding: 14px;
        background:
          linear-gradient(135deg, rgba(244, 201, 93, 0.12), rgba(13, 18, 15, 0.86)),
          rgba(13, 18, 15, 0.86);
      }

      .review-panel[hidden] {
        display: none;
      }

      .review-board {
        display: grid;
        gap: 8px;
      }

      .review-board > span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .review-board-cards {
        min-height: 58px;
      }

      .review-board-cards .card {
        width: 42px;
        height: 58px;
      }

      .review-list {
        display: grid;
        gap: 10px;
      }

      .review-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding: 10px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      .review-row.winner {
        color: var(--accent-2);
      }

      .review-main {
        display: grid;
        gap: 6px;
        min-width: 0;
      }

      .review-name {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        align-items: center;
        font-weight: 850;
      }

      .review-hand {
        display: flex;
        gap: 6px;
      }

      .review-hand .card {
        width: 36px;
        height: 50px;
        border-radius: 6px;
      }

      .review-hand .card .rank {
        font-size: 15px;
      }

      .review-hand .card .suit {
        font-size: 22px;
      }

      .review-result {
        text-align: right;
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
      }

      .log-panel {
        grid-column: 1 / -1;
        padding: 12px 14px;
      }

      .recent-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0 12px;
      }

      .log-chip {
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--text);
        padding: 6px 9px;
        font-size: 12px;
        font-weight: 750;
      }

      .log-chip.bet,
      .log-chip.raise,
      .log-chip.allin {
        background: rgba(244, 201, 93, 0.18);
        color: #ffe08a;
      }

      .log-chip.call,
      .log-chip.check {
        background: rgba(56, 193, 114, 0.15);
        color: #86ecad;
      }

      .log-chip.fold {
        background: rgba(255, 107, 107, 0.15);
        color: #ffabab;
      }

      .log-panel .console {
        max-height: 280px;
        min-height: 180px;
        box-shadow: none;
      }

      .controls {
        grid-column: 2 / 3;
        grid-row: 4 / span 2;
      }

      @media (max-width: 780px) {
        .app {
          padding-bottom: 18px;
        }
        header {
          display: block;
        }
        .setup-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .setup-grid .wide {
          grid-column: span 2;
        }
        .game-shell {
          grid-template-columns: 1fr;
        }
        .table-top,
        .stats-strip,
        .action-panel,
        .felt,
        .players-panel,
        .review-panel,
        .log-panel,
        .controls {
          grid-column: 1;
          grid-row: auto;
        }
        .table-top {
          padding: 12px;
        }
        h2 {
          font-size: 22px;
        }
        .stats-strip div {
          padding: 10px 9px;
        }
        .action-panel {
          padding: 11px 12px;
        }
        .action-focus {
          font-size: 16px;
        }
        .felt {
          min-height: 230px;
          padding: 14px;
        }
        .players-panel {
          padding: 12px;
        }
        .log-panel {
          margin-bottom: 114px;
        }
        .game-shell .controls {
          position: fixed;
          top: auto;
          right: 10px;
          bottom: max(10px, env(safe-area-inset-bottom));
          left: 10px;
          z-index: 20;
          padding: 10px;
          border-color: rgba(255, 255, 255, 0.14);
          background: rgba(12, 17, 14, 0.96);
          backdrop-filter: blur(16px);
        }
        .prompt {
          min-height: 32px;
          padding: 7px 8px;
        }
        .game-shell .quick-grid {
          gap: 7px;
        }
        .game-shell .btn {
          min-height: 40px;
        }
        .table {
          grid-template-columns: 1fr;
        }
        .console {
          min-height: 430px;
          max-height: 56vh;
          padding: 12px;
        }
        .table .controls {
          position: static;
          gap: 10px;
        }
        .output {
          font-size: 13px;
        }
        .quick-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .btn {
          padding: 0 8px;
        }
      }

      @media (max-width: 430px) {
        .setup-grid {
          grid-template-columns: 1fr;
        }
        .setup-grid .wide {
          grid-column: auto;
        }
        .quick-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .stats-strip {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .stats-strip div:nth-child(2) {
          border-right: 0;
        }
        .stats-strip div:nth-child(-n + 2) {
          border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }
        .card {
          width: 44px;
          height: 60px;
        }
        .hero-cards .card {
          width: 54px;
          height: 72px;
        }
        .amount-row {
          grid-template-columns: 1fr 1fr;
        }
        .amount-row input {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <div>
          <h1>Pokerface</h1>
        </div>
      </header>

      <details class="setup" id="setupPanel" open aria-label="游戏配置">
        <summary>
          <span>基础设定</span>
          <span id="setupSummary">6人 / 1000 / 盲注 5-10 / 普通 / 水下开</span>
        </summary>
        <form id="setupForm" class="setup-grid">
          <label
            >总人数
            <input
              id="playerCount"
              type="number"
              min="2"
              max="9"
              value="6"
              inputmode="numeric"
            />
          </label>
          <label
            >初始筹码
            <input
              id="initialStack"
              type="number"
              min="1"
              value="1000"
              inputmode="numeric"
            />
          </label>
          <label
            >小盲注
            <input
              id="smallBlind"
              type="number"
              min="1"
              value="5"
              inputmode="numeric"
            />
          </label>
          <label
            >大盲注
            <input
              id="bigBlind"
              type="number"
              min="2"
              value="10"
              inputmode="numeric"
            />
          </label>
          <label
            >AI 难度
            <select id="difficulty">
              <option value="简单">简单</option>
              <option value="普通" selected>普通</option>
              <option value="困难">困难</option>
            </select>
          </label>
          <label class="wide"
            >水下模式
            <span class="check-row"
              ><input id="underwater" type="checkbox" checked /> 开启</span
            >
          </label>
          <button id="startBtn" class="btn primary wide" type="submit">
            开始游戏
          </button>
        </form>
      </details>

      <section class="game-shell" id="gameShell" aria-label="游戏区">
        <div class="table-top">
          <div>
            <div class="eyebrow" id="handLabel">未开始</div>
            <h2 id="streetLabel">等待发牌</h2>
          </div>
          <button class="icon-btn" data-command="q" disabled aria-label="退出">
            退出
          </button>
        </div>

        <div class="stats-strip">
          <div><span>位置</span><strong id="positionLabel">-</strong></div>
          <div><span>底池</span><strong id="potValue">0</strong></div>
          <div><span>最高注</span><strong id="currentBetValue">0</strong></div>
          <div><span>需跟注</span><strong id="toCallValue">0</strong></div>
        </div>

        <section class="action-panel" aria-label="本轮行动">
          <div class="section-title">本轮行动</div>
          <div class="action-focus" id="actionFocus">暂无行动</div>
          <div class="recent-list" id="recentActions">暂无</div>
        </section>

        <section class="felt" aria-label="牌桌">
          <div class="zone">
            <div class="zone-title">公共牌</div>
            <div class="cards board-cards" id="boardCards"></div>
          </div>
          <div class="zone hero-zone">
            <div class="zone-title">你的手牌</div>
            <div class="cards hero-cards" id="heroCards"></div>
          </div>
        </section>

        <section class="players-panel" aria-label="玩家">
          <div class="section-title">玩家</div>
          <div id="playersList" class="players-list"></div>
        </section>

        <section class="review-panel" id="reviewPanel" aria-label="本手复盘" hidden>
          <div class="section-title">本手复盘</div>
          <div class="review-board">
            <span>完整公共牌</span>
            <div class="cards review-board-cards" id="reviewBoardCards"></div>
          </div>
          <div class="review-list" id="reviewList"></div>
        </section>

        <details class="log-panel">
          <summary>
            <span>完整记录</span>
            <span>展开</span>
          </summary>
          <div class="console" id="console" aria-live="polite">
            <pre class="output" id="output">设置参数后点击“开始游戏”。</pre>
          </div>
        </details>

        <aside class="controls" aria-label="操作面板">
          <div class="prompt" id="prompt">等待开始</div>
          <div class="quick-grid">
            <button class="btn danger" data-command="f" disabled>弃牌</button>
            <button
              class="btn primary"
              id="actionCallBtn"
              data-command="c"
              disabled
            >
              过牌
            </button>
            <button class="btn warn" data-command="a" disabled>全下</button>
            <button class="btn" data-command="" disabled>继续</button>
          </div>
          <div class="amount-row">
            <input
              id="amountInput"
              type="number"
              min="1"
              value="50"
              inputmode="numeric"
